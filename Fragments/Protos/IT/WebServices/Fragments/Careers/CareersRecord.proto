syntax = "proto3";

package IT.WebServices.Fragments.Careers;
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

enum JobType {
	FULL_TIME = 0;
	PART_TIME = 1;
	HYBRID = 3;
	REMOTE = 4;
	CONTRACT = 5;
}

message ListingLocation {
	string Area = 1 [(buf.validate.field).string.min_len = 2];
	bool RelocationRequired = 2;
	JobType EmploymentType = 3 [(buf.validate.field).enum.defined_only = true];
}

message CareerRecord {
	string CareerId = 1;
	string Title = 2;
	string Company = 3;
	ListingLocation Location = 4;
	string Department = 5;
	string Contact = 6;

	// Everything else — About, RoleOverview, Responsibilities,
	// Qualifications, ReportsTo, WeeklyDeliverables, future sections —
	// lives here as markdown with conventional headers.
	string BodyMarkdown = 7;

	google.protobuf.Timestamp CreatedOnUTC = 12;
	google.protobuf.Timestamp ModifiedOnUTC = 13;
	google.protobuf.Timestamp DeletedOnUTC = 14;
}

message CareerListRecord {
	string CareerId = 1;
	string Title = 2;
	string Company = 3;
	ListingLocation Location = 4;
	string Department = 5;
	string Summary = 6;
	google.protobuf.Timestamp CreatedOnUTC = 7;
	google.protobuf.Timestamp ModifiedOnUTC = 8;
	google.protobuf.Timestamp DeletedOnUTC = 9;
}