syntax = "proto3";

package IT.WebServices.Fragments.Merch;

import "google/protobuf/timestamp.proto";

enum MerchRecordProvider {
	Shopify = 0;
}

enum MerchStatus {
    MerchStatus_Unknown = 0;
    MerchStatus_Active  = 1;
    MerchStatus_Draft   = 2;
}

message MerchVariantOption {
    string Name  = 1;
    string Value = 2;
}

message MerchBulkActionProgress {
    MerchBulkAction Action = 1;
    float Progress = 2;
    string StatusMessage = 3;
    google.protobuf.Timestamp CreatedOnUTC = 21;
    google.protobuf.Timestamp CanceledOnUTC = 22;
    google.protobuf.Timestamp CompletedOnUTC = 23;
    string CreatedBy = 31;
    string CanceledBy = 32;
}

enum MerchBulkAction {
    PullFromAll = 0;
}
