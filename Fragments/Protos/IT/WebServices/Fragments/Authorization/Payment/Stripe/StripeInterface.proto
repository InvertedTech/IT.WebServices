syntax = "proto3";

package IT.WebServices.Fragments.Authorization.Payment.Stripe;

import "google/api/annotations.proto";
import "Protos/IT/WebServices/Fragments/Authorization/Payment/DataRecords.proto";

service StripeInterface {
  rpc StripeFinishOwnSubscription (StripeFinishOwnSubscriptionRequest) returns (StripeFinishOwnSubscriptionResponse)
  {
    option (google.api.http) = {
      post: "/api/payment/stripe/subscription/finish"
      body: "*"
    };
  }
}

message StripeEnsureOneTimeProductRequest {
	string InternalID = 1;
	string Name = 2;
	uint32 MinimumPrice = 11;
	uint32 MaximumPrice = 12;
}

message StripeEnsureOneTimeProductResponse {
	string Error = 1;
}

message StripeFinishOwnSubscriptionRequest {
  string ProcessorSessionID = 1;
}

message StripeFinishOwnSubscriptionResponse {
  GenericSubscriptionRecord Record = 1;
  string Error = 2;
}
