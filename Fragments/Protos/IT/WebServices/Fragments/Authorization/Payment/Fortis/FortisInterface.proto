syntax = "proto3";

package IT.WebServices.Fragments.Authorization.Payment.Fortis;

import "google/api/annotations.proto";
import "Protos/IT/WebServices/Fragments/Authorization/Payment/DataRecords.proto";

service FortisInterface {
  rpc FortisFinishOwnSubscription (FortisFinishOwnSubscriptionRequest) returns (FortisFinishOwnSubscriptionResponse)
  {
    option (google.api.http) = {
      post: "/api/payment/fortis/subscription/finish"
      body: "*"
    };
  }

  rpc FortisFinishUpdateOwnCard (FortisFinishUpdateOwnCardRequest) returns (FortisFinishUpdateOwnCardResponse)
  {
    option (google.api.http) = {
      post: "/api/payment/fortis/subscription/updatecard/finish"
      body: "*"
    };
  }

  rpc FortisStartUpdateOwnCard (FortisStartUpdateOwnCardRequest) returns (FortisStartUpdateOwnCardResponse)
  {
    option (google.api.http) = {
      post: "/api/payment/fortis/subscription/updatecard"
      body: "*"
    };
  }
}

message FortisFinishOwnSubscriptionRequest {
  string TransactionID = 1;
}

message FortisFinishOwnSubscriptionResponse {
  GenericSubscriptionRecord Record = 1;
  string Error = 2;
}

message FortisFinishUpdateOwnCardRequest {
  string InternalSubscriptionID = 1;
  string TransactionID = 2;
}

message FortisFinishUpdateOwnCardResponse {
  GenericSubscriptionRecord Record = 1;
  string Error = 2;
}

message FortisStartUpdateOwnCardRequest {
  string InternalSubscriptionID = 1;
}

message FortisStartUpdateOwnCardResponse {
  string ClientToken = 1;
  string Error = 2;
}
