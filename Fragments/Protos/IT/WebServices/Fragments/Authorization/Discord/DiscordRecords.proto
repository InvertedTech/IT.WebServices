syntax = "proto3";

package IT.WebServices.Fragments.Authorization.Discord;

import "google/protobuf/timestamp.proto";

message DiscordMemberPublicRecord {
	string DiscordUserId = 1;															// User's Discord Account Global Id
	string DiscordUserName = 2;														// User's Discord Account Global UserName
	repeated string Tiers = 3;															// Stores the Subscription Tiers That Apply To This User
	string BannedReason = 4;															// Reason This Member Was Banned
	google.protobuf.Timestamp CreatedOnUTC = 10;						// DateTimeUTC When This Record Was Created
	google.protobuf.Timestamp ModifiedOnUTC = 11;					// DateTimeUTC When This Record Was Modified
	google.protobuf.Timestamp BannedOnUTC = 12;						// DateTimeUTC When This Member Was Banned
}

message DiscordMemberPrivateRecord {
	string CreatedById = 1;																// User ID of the User That Created This Record
	string ModifiedById = 2;																// User ID of the User That Last Modified This Record
	string BannedByDiscordId = 3;													// Discord ID of the Mod/Admin That Banned This Member
	string InternalSubscriptionId = 4;												// Reference To The User's Internal Subscription Record (If Any)
}

message DiscordMemberServerRecord {
    string AccessToken = 1;																	// Discord OAuth access token
    string RefreshToken = 2;																	// Discord OAuth refresh token (long-lived)
    google.protobuf.Timestamp AccessTokenExpiresOnUTC = 10;		// When the access token expires (~10 min)
    google.protobuf.Timestamp CreatedOnUTC = 11;							// DateTimeUTC When This Record Was Created
    google.protobuf.Timestamp ModifiedOnUTC = 12;						// DateTimeUTC When Tokens Were Last Refreshed
}

message DiscordMemberRecord {
	string UserId = 1;
	DiscordMemberPublicRecord Public = 2;
	DiscordMemberPrivateRecord Private = 3;
	DiscordMemberServerRecord Server = 4;
}

enum ShunStatus {
	SHUN_ACTIVE = 0;
	SHUN_INACTIVE = 1;
}

message DiscordShunRecord {
	string ShunId = 1;															// GUID For this Record
	string UserId = 2;												// References the UserRecord.UserID property
	string ShunnedByDiscordId = 3;										// Discord Id of the Mod/Admin That Invoked the Shun Command
	string Reason = 4;															// Reason User Was Shunned
	ShunStatus Status = 5;														// Status of this Shun Record
	google.protobuf.Timestamp CreatedOnUTC = 6;			// DateTimeUTC When This Record Was Created
	google.protobuf.Timestamp UnShunnedOnUTC = 7;		// DateTimeUTC When This User Was UnShunned
	string UnShunnedByDiscordId = 8;								// Discord Id Of The Mod/Admin That UnShunned The User
}

enum TicketStatus {
	TICKET_OPEN = 0;
	TICKET_CLOSED = 1;
}

message DiscordTicketThreadMessage {
	string MessageId = 1;														// Guid For This Record
	string TicketId = 2;															// References The DiscordTicketRecord.TicketId property
	string UserId = 3;												// References The UserRecord.UserID property (if sender is a platform user)
	string SentByDiscordId = 4;											// Discord ID of the User That Sent This Message
	string Text = 5;																	// Message Content
	google.protobuf.Timestamp CreatedOnUTC = 6;			// DateTimeUTC When This Message Was Sent
}

message DiscordTicketRecord {
	string TicketId = 1;															// Guid For This Record
	string UserId = 2;												// References The UserRecord.UserID property
	string ThreadId = 3;															// Discord thread snowflake ID
	TicketStatus Status = 4;													// Status of this Ticket Record
	string Subject = 5;															// Subject Line For This Ticket
	string Text = 6;																	// Body Text For This Ticket
	google.protobuf.Timestamp CreatedOnUTC = 7;			// DateTimeUTC When This Record Was Created
	google.protobuf.Timestamp ClosedOnUTC = 8;			// DateTimeUTC When This Record Was Closed
	string ClosedByDiscordId = 9;										// Discord ID of the Mod/Admin That Closed This Ticket
	repeated DiscordTicketThreadMessage Messages = 10;
}

